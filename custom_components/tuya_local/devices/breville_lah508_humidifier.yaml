name: Humidifier
products:
  - id: 6pxoqf0qpaxqtpj3
    manufacturer: Breville
    model: Smart Mist Top
    model_id: LAH508
entities:
  - entity: humidifier
    class: humidifier
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 13
        type: integer
        name: humidity
        range:
          min: 30
          max: 95
        mapping:
          - step: 5
      - id: 14
        type: integer
        name: current_humidity
      - id: 24
        type: string
        name: mode
        mapping:
          - dps_val: auto
            value: auto
          - dps_val: adjust_speed
            value: Auto speed
          - dps_val: adjust_humi
            value: Auto humidity
          - dps_val: manual
            value: manual
      - id: 101
        type: boolean
        name: action
        mapping:
          - dps_val: false
            value: humidifying
          - dps_val: true
            value: idle
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 23
        type: string
        name: speed
        mapping:
          - dps_val: level_1
            value: 20
          - dps_val: level_2
            value: 40
          - dps_val: level_3
            value: 60
          - dps_val: level_4
            value: 80
          - dps_val: level_5
            value: 100
  - entity: light
    name: Light
    category: config
    dps:
      - id: 5
        type: boolean
        name: switch
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 8
        type: boolean
        name: switch
  - entity: switch
    translation_key: sleep
    category: config
    dps:
      - id: 16
        type: boolean
        name: switch
  - entity: switch
    name: Heat
    icon: "mdi:heat-wave"
    category: config
    dps:
      - id: 26
        type: boolean
        name: switch
  - entity: switch
    translation_key: ionizer
    category: config
    dps:
      - id: 35
        type: boolean
        name: switch
  - entity: sensor
    class: temperature
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: C
        class: measurement
      - id: 12
        type: integer
        name: temperature_f
        optional: true
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 18
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: 1h
            value: "1h"
          - dps_val: 2h
            value: "2h"
          - dps_val: 3h
            value: "3h"
          - dps_val: 4h
            value: "4h"
          - dps_val: 5h
            value: "5h"
          - dps_val: 6h
            value: "6h"
          - dps_val: 7h
            value: "7h"
          - dps_val: 8h
            value: "8h"
          - dps_val: 9h
            value: "9h"
          - dps_val: 10h
            value: "10h"
          - dps_val: 11h
            value: "11h"
          - dps_val: 12h
            value: "12h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: min
        class: measurement
  - entity: binary_sensor
    translation_key: tank_empty
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - dps_val: 3
            value: true
          - value: false
  - entity: binary_sensor
    translation_key: tank_full
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 2
            value: true
          - dps_val: 3
            value: true
          - value: false
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 22
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 22
        type: bitfield
        name: fault_code
      - id: 22
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Water shortage
          - dps_val: 2
            value: Water tank full
          - dps_val: 3
            value: Water shortage and tank full
