name: Hot water
products:
  - id: qafgqk3ghlw5nqui
    manufacturer: Hydrotherm
    model: Fusion X8
entities:
  - entity: water_heater
    dps:
      - id: 1
        type: boolean
        name: operation_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: heat_pump
      - id: 2
        type: integer
        name: temperature
        unit: C
        range:
          min: 15
          max: 75
      - id: 3
        type: integer
        name: current_temperature
      - id: 4
        type: string
        name: mode
        hidden: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 21
        type: bitfield
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 21
        type: bitfield
        name: fault_code
      - id: 21
        type: bitfield
        name: description
        mapping:
          - dps_val: 0
            value: ok
          - dps_val: 1
            value: Flow switch
          - dps_val: 2
            value: Discharge temperature too high
          - dps_val: 4
            value: High pressure protection
          - dps_val: 8
            value: Low pressure protection
          - dps_val: 16
            value: Communication error
          - dps_val: 32
            value: Outdoor coil sensor fault
          - dps_val: 64
            value: Outdoor ambient sensor fault
          - dps_val: 128
            value: Discharge temperature sensor fault
          - dps_val: 256
            value: Water tank sensor fault
          - dps_val: 512
            value: Suction temperature sensor fault
          - dps_val: 1024
            value: Water outlet sensor fault
          - dps_val: 2048
            value: Return water sensor fault
          - dps_val: 4096
            value: Outlet water temperature too high
          - dps_val: 8192
            value: Outlet water temperature too low
          - dps_val: 16384
            value: Phase not connected
          - dps_val: 32768
            value: Phase sequence wrong
          - dps_val: 65536
            value: DIP switch setting wrong
          - dps_val: 131072
            value: Board error
          - dps_val: 262144
            value: Solar tank sensor fault
          - dps_val: 524288
            value: Frequency conversion fault
          - dps_val: 1048576
            value: DC fan fault
          - dps_val: 2097152
            value: Outdoor temperature too low
  - entity: sensor
    name: Coil temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 101
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    translation_key: ambient_temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 102
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Return air temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Exhaust temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 104
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Tank temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 105
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Return water temperature
    class: temperature
    category: diagnostic
    dps:
      - id: 106
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Main valve
    icon: "mdi:pipe-valve"
    category: diagnostic
    dps:
      - id: 107
        type: integer
        name: sensor
        class: measurement
  - entity: sensor
    name: Compressor frequency
    class: frequency
    category: diagnostic
    dps:
      - id: 108
        type: integer
        name: sensor
        unit: Hz
        class: measurement
  - entity: sensor
    name: Fan frequency
    class: frequency
    category: diagnostic
    dps:
      - id: 110
        type: integer
        name: sensor
        unit: Hz
        class: measurement
  - entity: binary_sensor
    name: Four-way valve
    class: opening
    category: diagnostic
    dps:
      - id: 109
        type: boolean
        name: sensor
  - entity: binary_sensor
    name: Element
    class: running
    icon: "mdi:heating-coil"
    category: diagnostic
    dps:
      - id: 113
        type: boolean
        name: sensor
